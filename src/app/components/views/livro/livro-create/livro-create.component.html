<form class="editor-form">
    <h1>Novo livro</h1>

    <mat-form-field class="form">
        <mat-label>Título</mat-label>
        <input matInput [(ngModel)]="livro.titulo" [formControl]="titulo" required type="text" name="titulo" placeholder="Ex. Curso Spring Boot com Angular 10" maxlength="100">
        <mat-error *ngIf="titulo.invalid">{{getMessage()}}</mat-error>
    </mat-form-field>

    <mat-form-field class="form">
        <mat-label>Nome do Autor</mat-label>
        <input matInput [(ngModel)]="livro.nome_autor" [formControl]="nome_autor" required type="text" name="nome_autor" placeholder="Ex. Murillo Santos" maxlength="100">
        <mat-error *ngIf="nome_autor.invalid">{{getMessage()}}</mat-error>
    </mat-form-field>

    <mat-form-field class="form">
        <mat-label>Texto</mat-label>
        <textarea matInput [(ngModel)]="livro.texto" [formControl]="texto" required type="text" name="texto" placeholder="Ex. Lorem ipsom" maxlength="2000000"></textarea>
        <mat-error *ngIf="texto.invalid">{{getMessage()}}</mat-error>
    </mat-form-field>

    <div class="buttons">
        <button type="button" (click)="create()" [disabled]="getMessage()" mat-stroked-button color="primary"> Criar </button>
        <button type="button" (click)="cancel()" mat-stroked-button color="warn"> Cancelar </button>
    </div>

</form>
