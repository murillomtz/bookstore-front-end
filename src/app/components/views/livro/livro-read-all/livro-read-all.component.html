<section class="content">
    <a class="collection-back" routerLink="/categorias"><mat-icon>arrow_back</mat-icon>Todas as categorias</a>
    <div class="page-heading">
        <div><span class="eyebrow">BIBLIOTECA / LIVROS</span><h1>Livros da coleção</h1><p>Explore as leituras que fazem parte desta categoria.</p></div>
        <button type="button" mat-stroked-button color="primary" (click)="navegarParaCriarLivro()"><mat-icon>add</mat-icon>Novo livro</button>
    </div>
    <div class="content-table">
        <table class="table" mat-table [dataSource]="livros">

            <!-- Position Column -->
            <ng-container matColumnDef="id">
                <th mat-header-cell *matHeaderCellDef> ID </th>
                <td mat-cell *matCellDef="let row"> {{row.id}} </td>
            </ng-container>

            <!-- Name Column -->
            <ng-container matColumnDef="titulo">
                <th mat-header-cell *matHeaderCellDef> Título </th>
                <td mat-cell *matCellDef="let row"> {{row.titulo}} </td>
            </ng-container>

            <ng-container matColumnDef="livros">
                <th mat-header-cell *matHeaderCellDef> Leitura </th>
                <td mat-cell *matCellDef="let row">
                    <a class="table-action livros" aria-label="Ler livro" title="Ler livro" routerLink="{{row.id}}/read">
                        <i class="material-icons"> book </i>
                    </a>
                </td>
            </ng-container>

            <!-- Symbol Column -->
            <ng-container matColumnDef="acoes">
                <th class="mat-header" mat-header-cell *matHeaderCellDef> Ações </th>
                <td mat-cell *matCellDef="let row">
                    <a class="table-action edit" aria-label="Editar" title="Editar" routerLink='{{row.id}}/update'>
                        <i class="material-icons">edit</i>
                    </a>
                    <a class="table-action delete" aria-label="Excluir" title="Excluir" routerLink='{{row.id}}/delete'>
                        <i class="material-icons">delete</i>
                    </a>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>


    </div>
</section>
