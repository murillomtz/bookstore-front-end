<form class="editor-form">
    <h1>Excluir livro</h1>
    <p class="delete-note">Confirme os dados antes de excluir. Esta ação não pode ser desfeita.</p>

    <mat-form-field class="form">
        <mat-label>Título</mat-label>
        <input matInput [(ngModel)]="livro.titulo" type="text" name="titulo" disabled>

    </mat-form-field>

    <mat-form-field class="form">
        <mat-label>Nome do Autor</mat-label>
        <input matInput [(ngModel)]="livro.nome_autor" type="text" name="nome_autor" disabled>

    </mat-form-field>

    <mat-form-field class="form">
        <mat-label>Texto</mat-label>
        <textarea matInput [(ngModel)]="livro.texto" type="text" name="texto" disabled></textarea>

    </mat-form-field>

    <div class="buttons">
        <button type="button" class="danger-action" (click)="delete()" mat-stroked-button color="primary"> Excluir </button>
        <button type="button" (click)="cancel()" mat-stroked-button color="warn"> Cancelar </button>
    </div>

</form>
