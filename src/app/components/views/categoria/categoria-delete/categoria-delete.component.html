<form class="editor-form">
    <h1>Excluir categoria</h1>
    <p class="delete-note">Confirme os dados antes de excluir. Esta ação não pode ser desfeita.</p>

    <mat-form-field class="form">
        <mat-label>Nome</mat-label>
        <input matInput [(ngModel)]="categoria.nome" type="text" name="nome" disabled>
    </mat-form-field>

    <mat-form-field class="form">
        <mat-label>Descrição</mat-label>
        <textarea matInput [(ngModel)]="categoria.descricao" type="text" name="descricao" disabled></textarea>
    </mat-form-field>

    <div class="buttons">
        <button type="button" class="danger-action" (click)="delete()" mat-stroked-button color="primary"> Excluir </button>
        <button type="button" routerLink="/categorias" mat-stroked-button color="warn"> Cancelar </button>
    </div>

</form>
