<form class="editor-form">
    <h1>Nova categoria</h1>

    <mat-form-field class="form">
        <mat-label>Nome</mat-label>
        <input matInput [(ngModel)]="categoria.nome" type="text" name="nome" placeholder="Ex. Computação">
    </mat-form-field>

    <mat-form-field class="form">
        <mat-label>Descrição</mat-label>
        <textarea matInput [(ngModel)]="categoria.descricao" type="text" name="descricao" placeholder="Ex. Livro de Computação"></textarea>
    </mat-form-field>

    <div class="buttons">
        <button type="button" (click)="create()" mat-stroked-button color="primary"> Criar </button>
        <button type="button" routerLink="/categorias" mat-stroked-button color="warn"> Cancelar </button>
    </div>

</form>
